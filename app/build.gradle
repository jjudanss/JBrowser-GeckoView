plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jbrowser.tv'
    compileSdk 37

    defaultConfig {
        applicationId 'com.jbrowser.tv'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '2.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Generate a separate APK for each supported GeckoView ABI.
    // No universal APK is produced, avoiding bundled copies of every native engine.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk false
        }
    }

    buildTypes {
        debug {
            // Debug remains available for local troubleshooting.
        }
        release {
            // R8 removes unused app bytecode; resource shrinking removes unused app resources.
            minifyEnabled true
            shrinkResources true
            // Temporary side-load signing for GitHub test releases.
            // Configure a persistent private keystore via GitHub Actions secrets for public updates.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            // Compress GeckoView .so files to reduce APK download size.
            // Android extracts them at installation, so installed storage can be larger.
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // GeckoView universal AAR; ABI splits above ensure each APK contains only one ABI.
    implementation 'org.mozilla.geckoview:geckoview:160.0.20261116130455'
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jbrowser.tv'
    compileSdk 37

    defaultConfig {
        applicationId 'com.jbrowser.tv'
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName '2.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Produce one APK for each ABI that GeckoView 160 provides.
    // There is no 32-bit x86 binary in this GeckoView build.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            // Keep the downloaded APK compressed. Android extracts these .so files
            // during installation; this reduces download size, not installed footprint.
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:160.0.20261116130455'
}

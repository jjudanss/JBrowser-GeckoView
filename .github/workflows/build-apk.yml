
name: Build JBrowser GeckoView Android TV APKs

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    name: Build optimized JBrowser 2.2.0 APKs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 37
        run: |
          sdkmanager --install --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build release APKs
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Collect and verify APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          collect_apk() {
            abi="$1"
            source="app/build/outputs/apk/release/app-${abi}-release.apk"
            output="dist/JBrowser-2.2.0-Android-TV-${abi}.apk"

            if [ ! -f "$source" ]; then
              echo "Missing APK: $source"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
              exit 1
            fi

            mapfile -t found_abis < <(
              unzip -Z1 "$source" |
              awk -F/ '$1 == "lib" && $3 ~ /\.so$/ {print $2}' |
              sort -u
            )

            if [ "${#found_abis[@]}" -ne 1 ] || [ "${found_abis[0]}" != "$abi" ]; then
              echo "ABI verification failed: $source"
              exit 1
            fi

            cp "$source" "$output"
            echo "Verified $abi"
            du -h "$output"
          }

          collect_apk arm64-v8a
          collect_apk armeabi-v7a
          collect_apk x86_64

          echo "All three APKs verified."
          ls -lh dist/

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: JBrowser-2.2.0-ARM64
          path: dist/JBrowser-2.2.0-Android-TV-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: JBrowser-2.2.0-ARMv7
          path: dist/JBrowser-2.2.0-Android-TV-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: JBrowser-2.2.0-x86_64
          path: dist/JBrowser-2.2.0-Android-TV-x86_64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: JBrowser ${{ github.ref_name }} for Android TV
          body: |
            JBrowser 2.2.0 GeckoView Android TV browser.

            Includes remote pointer improvements,
            compatible Firefox WebExtensions and
            optional uBlock Origin installation.

            Android 8.0 or newer required.
            Debug-signed test build.
          files: |
            dist/JBrowser-2.2.0-Android-TV-arm64-v8a.apk
            dist/JBrowser-2.2.0-Android-TV-armeabi-v7a.apk
            dist/JBrowser-2.2.0-Android-TV-x86_64.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

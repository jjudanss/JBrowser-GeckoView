
name: Build JBrowser GeckoView Android TV APKs

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    name: Build optimized GeckoView APKs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 37
        run: |
          sdkmanager --install --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build release APKs
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Collect and verify three APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          shopt -s nullglob

          apks=(app/build/outputs/apk/release/*.apk)

          if [ ${#apks[@]} -ne 3 ]; then
            echo "Expected 3 APKs, found ${#apks[@]}"
            ls -lh app/build/outputs/apk/release/ || true
            exit 1
          fi

          declare -A seen=()

          for apk in "${apks[@]}"; do
            mapfile -t abis < <(
              unzip -Z1 "$apk" |
              awk -F/ '$1 == "lib" && $3 ~ /\.so$/ {print $2}' |
              sort -u
            )

            if [ ${#abis[@]} -ne 1 ]; then
              echo "Invalid native ABI packaging: $apk"
              unzip -Z1 "$apk" | grep '^lib/' || true
              exit 1
            fi

            abi="${abis[0]}"

            case "$abi" in
              arm64-v8a|armeabi-v7a|x86_64)
                ;;
              *)
                echo "Unexpected ABI: $abi"
                exit 1
                ;;
            esac

            if [[ -n "${seen[$abi]:-}" ]]; then
              echo "Duplicate ABI: $abi"
              exit 1
            fi

            seen[$abi]=1

            cp "$apk" \
              "dist/JBrowser-2.1.0-Android-TV-${abi}.apk"

            echo "Verified $abi"
            du -h "dist/JBrowser-2.1.0-Android-TV-${abi}.apk"
          done

          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -n "${seen[$abi]:-}" || {
              echo "Missing APK for $abi"
              exit 1
            }
          done

          echo "All three APKs verified successfully."

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: JBrowser-2.1.0-ARM64
          path: dist/JBrowser-2.1.0-Android-TV-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: JBrowser-2.1.0-ARMv7
          path: dist/JBrowser-2.1.0-Android-TV-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: JBrowser-2.1.0-x86_64
          path: dist/JBrowser-2.1.0-Android-TV-x86_64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: JBrowser ${{ github.ref_name }} for Android TV
          body: |
            JBrowser 2.1.0 GeckoView edition.

            Available architectures:
            - ARM64
            - ARMv7
            - x86_64

            Each APK contains one architecture only.
            Android 8.0 or newer required.
            Debug-signed test build.
          files: |
            dist/JBrowser-2.1.0-Android-TV-arm64-v8a.apk
            dist/JBrowser-2.1.0-Android-TV-armeabi-v7a.apk
            dist/JBrowser-2.1.0-Android-TV-x86_64.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
